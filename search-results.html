<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả tìm kiếm - ABC Bakery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css"> 
    <style>
         /* Nếu chưa tách file CSS riêng, hãy paste toàn bộ CSS vào đây */
         /* CÀI ĐẶT CHUNG... (Copy từ câu trả lời trước) */
         /* =========================================
   1. CÀI ĐẶT CHUNG (RESET & BASE)
   ========================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 200vh;
    background-color: #fcfaf7;
}

/* =========================================
   2. HEADER & LOGO
   ========================================= */
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
    color: #fff;
    background-color: transparent;
    transition: all 0.4s ease;
}

/* Header khi cuộn xuống */
header.scrolled {
    background-color: #5D4037; /* Màu Nâu chủ đạo */
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    padding: 10px 50px;
}

.logo-text {
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.logo-text span {
    color: #d32f2f;
}

/* =========================================
   3. MENU CHÍNH (NAVBAR LEVEL 1)
   ========================================= */
.navbar ul {
    display: flex;
    list-style: none;
    gap: 30px;
    margin: 0;
    padding: 0;
}

.navbar ul li {
    position: relative; /* Quan trọng để định vị dropdown */
}

.navbar ul li a {
    text-decoration: none;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    text-transform: uppercase;
    position: relative;
    padding-bottom: 5px;
    display: block; /* Mặc định cho menu cấp 1 */
}

/* Hiệu ứng gạch chân (Từ giữa ra 2 bên) */
.navbar ul li a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background-color: #fff;
    transition: width 0.5s ease;
}

.navbar ul li a:hover {
    color: #fff;
}

.navbar ul li a:hover::after {
    width: 100%;
}

.fa-chevron-down {
    font-size: 10px;
    margin-left: 5px;
    transition: transform 0.3s;
}

/* Xoay mũi tên khi hover */
.navbar ul li.dropdown:hover .fa-chevron-down {
    transform: rotate(180deg);
}

/* =========================================
   4. DROPDOWN MENU (LEVEL 2)
   ========================================= */

/* --- GIAO DIỆN DESKTOP (> 992px) --- */
@media (min-width: 993px) {
    .navbar ul li .dropdown-menu {
        position: absolute;
        top: 100%;
        left: 0;
        width: 220px; /* Độ rộng menu con */
        background-color: #5D4037; /* Nền nâu giống header */
        
        display: none; /* Mặc định ẩn */
        flex-direction: column; /* Xếp dọc */
        
        padding: 15px 20px;
        border-radius: 0 0 5px 5px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        z-index: 1100;
        gap: 10px; /* Khoảng cách giữa các món */
        align-items: flex-start; /* Căn trái toàn bộ nội dung */
    }

    /* Hover vào cha thì hiện menu con */
    .navbar ul li.dropdown:hover .dropdown-menu {
        display: flex;
        animation: fadeInUp 0.3s ease;
    }

    /* Style cho Tên Bánh trong Menu Con */
    .navbar ul li .dropdown-menu li a {
        display: inline-block; /* QUAN TRỌNG: Để gạch chân chỉ bằng chiều dài chữ */
        width: fit-content;    /* Độ rộng khớp nội dung */
        
        font-size: 14px;
        text-transform: capitalize; /* Chữ thường, viết hoa chữ cái đầu */
        border-bottom: 1px solid rgba(255, 255, 255, 0.1); /* Đường kẻ mờ ngăn cách */
        padding-bottom: 5px;
        margin-bottom: 2px;
        text-align: left;
    }
    
    /* Bỏ đường kẻ mờ ở mục cuối cùng cho đẹp */
    .navbar ul li .dropdown-menu li:last-child a {
        border-bottom: none;
    }

    /* Chỉnh vị trí gạch chân hover sát chữ */
    .navbar ul li .dropdown-menu li a::after {
        bottom: 2px; 
    }
    
    /* Animation hiện lên */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
}

/* =========================================
   5. HEADER RIGHT & ICONS
   ========================================= */
.header-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

.search-bar {
    display: flex;
    align-items: center;
    background-color: #fff;
    border-radius: 30px;
    padding: 5px 15px;
    width: 250px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

.search-bar input {
    border: none;
    outline: none;
    background: transparent;
    padding-left: 10px;
    width: 100%;
    font-size: 14px;
    color: #333;
}

.search-bar button {
    border: none;
    background: none;
    cursor: pointer;
    color: #5D4037;
    font-size: 16px;
}

.search-bar button:hover {
    color: #d32f2f;
    transform: scale(1.1);
}

.user-cart-actions {
    display: flex;
    gap: 10px;
}

.icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.4);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.3s;
    color: #fff;
    text-decoration: none;
}

.icon-btn:hover {
    background-color: #fff;
    color: #5D4037;
    transform: translateY(-3px);
}

/* =========================================
   6. BANNER & CONTENT
   ========================================= */
.banner {
    background-image: url('https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=2072&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    height: 100vh;
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
}

.banner-text {
    position: relative;
    z-index: 1;
    text-align: center;
    color: white;
    padding: 0 20px;
}

.banner-text h1 {
    font-size: 60px;
    margin-bottom: 20px;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
}

.banner-btn {
    padding: 12px 30px;
    background: #d32f2f;
    color: #fff;
    border: none;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.3s;
}

.banner-btn:hover {
    background: #b71c1c;
}

/* Search Results */
#searchResultsSection {
    display: none;
    padding: 60px 20px;
    background: #fff;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
}

#searchTitle {
    text-align: center;
    margin-bottom: 40px;
    color: #333;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 30px;
}

.product-card {
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    background: #fff;
}

.product-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.info {
    padding: 15px;
    text-align: center;
}

.name {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    color: #333;
    text-decoration: none;
}

.price {
    color: #d32f2f;
    font-weight: bold;
}

.content-dummy {
    height: 300px;
}

/* =========================================
   7. RESPONSIVE (MOBILE & TABLET)
   ========================================= */
.menu-toggle {
    display: none;
    font-size: 24px;
    color: #fff;
    cursor: pointer;
}

@media (max-width: 992px) {
    header, header.scrolled {
        padding: 15px 20px;
    }

    /* Navbar Mobile */
    .navbar {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: #5D4037;
        padding: 0;
        max-height: 0;
        overflow: hidden; /* Đóng menu */
        transition: max-height 0.4s ease;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
    }

    .navbar.active {
        max-height: 100vh; /* Mở menu đủ lớn để chứa dropdown */
        overflow-y: auto; /* Cho phép cuộn nếu menu quá dài */
        padding: 20px 0;
    }

    .navbar ul {
        flex-direction: column;
        gap: 0;
    }

    .navbar ul li a {
        display: block;
        padding: 15px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        width: 100%;
        text-align: center;
    }

    .navbar ul li a::after {
        display: none; /* Tắt gạch chân hiệu ứng trên mobile menu chính */
    }

    /* --- DROPDOWN MOBILE --- */
    .navbar ul li .dropdown-menu {
        position: static; /* Không bay lơ lửng nữa */
        display: none;    /* Mặc định ẩn */
        width: 100%;
        background-color: rgba(0, 0, 0, 0.2); /* Màu nền đậm hơn */
        box-shadow: none;
        padding: 10px 0 10px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        
        flex-direction: column;
        align-items: center; /* Căn giữa trên mobile cho đẹp */
    }
    
    /* Hiện dropdown khi hover (hoặc dùng JS click class active) */
    .navbar ul li.dropdown:hover .dropdown-menu {
        display: flex;
    }

    .navbar ul li .dropdown-menu li {
        width: 100%;
        text-align: center;
    }

    .navbar ul li .dropdown-menu li a {
        display: inline-block; /* Vẫn giữ inline-block để gạch chân đẹp */
        width: fit-content;
        padding: 10px 0;
        font-size: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .navbar ul li .dropdown-menu li a:hover::after {
         width: 100%; /* Gạch chân hoạt động trên mobile */
    }

    /* Layout Header Mobile */
    .menu-toggle {
        display: block;
        order: 3;
        margin-left: 15px;
    }

    .logo {
        order: 1;
        flex: 1;
    }

    .header-right {
        order: 2;
        gap: 10px;
    }

    .search-bar {
        display: none; /* Ẩn search bar ở header trên tablet dọc */
    }
}

@media (max-width: 576px) {
    .header-right {
        order: 3;
        width: 100%;
        margin-top: 15px;
        justify-content: space-between;
    }

    .search-bar {
        display: flex; /* Hiện lại search bar xuống dòng */
        width: 100%;
        order: 4;
        margin-top: 10px;
    }

    .menu-toggle {
        order: 2;
        margin-left: 0;
    }

    .user-cart-actions {
        margin-left: auto;
    }
}
    </style>
</head>
<body>

    <header id="mainHeader" class="scrolled"> <div class="logo">
            <a href="index.html" class="logo-text">A<span>B</span>C Bakery</a>
        </div>

        <div class="menu-toggle" id="mobile-menu-btn">
            <i class="fa-solid fa-bars"></i>
        </div>

        <nav class="navbar" id="navbar">
            <ul>
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="#">Giới thiệu</a></li>
                <li class="dropdown">
                    <a href="#">Sản phẩm <i class="fa-solid fa-chevron-down"></i></a>
                    <ul class="dropdown-menu">
                        <li><a href="#">Bánh kem</a></li>
                        <li><a href="#">Bánh ngọt</a></li>
                        <li><a href="#">Bánh nướng</a></li>
                        <li><a href="#">Bánh quy</a></li>
                        <li><a href="#">Bánh mousse</a></li>
                        <li><a href="#">Đồ uống</a></li>
                      </ul>
                </li>
                <li><a href="#">Tin tức</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>
        </nav>

        <div class="header-right">
            <div class="search-bar">
                <button id="btnSearchAction"><i class="fa-solid fa-magnifying-glass"></i></button>
                <input type="text" id="searchInput" placeholder="Tìm kiếm khác...">
            </div>

            <div class="user-cart-actions">
                <a href="#" class="icon-btn"><i class="fa-regular fa-user"></i></a>
                <a href="#" class="icon-btn"><i class="fa-regular fa-heart"></i></a>
                <a href="#" class="icon-btn"><i class="fa-solid fa-basket-shopping"></i></a>
            </div>
        </div>
    </header>

    <section class="banner" style="height: 60vh;"> <div class="banner-text">
            <h1 id="resultBannerTitle">Đang tìm kiếm...</h1>
            <p>Kết quả tìm kiếm của bạn tại ABC Bakery</p>
            
            <a href="index.html">
                <button class="banner-btn"><i class="fa-solid fa-arrow-left"></i> Quay về trang chủ</button>
            </a>
        </div>
    </section>

    <section style="padding: 60px 20px; background: #fff;">
        <div class="container">
            <h2 id="searchCount" style="text-align: center; margin-bottom: 40px; color: #333;"></h2>
            
            <div id="searchResultsGrid" class="product-grid">
                </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-bottom">
            <p>Copyright © 2025 Honeyque Pte Ltd. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // --- 1. DỮ LIỆU BÁNH (Cần có ở cả 2 trang) ---
        // Trong thực tế dữ liệu này nên để trong 1 file js riêng hoặc database
        const cakes = [
            { name: "Bánh Kem Dâu Tây", price: "450.000đ", img: "https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=500" },
            { name: "Tiramisu Thượng Hạng", price: "380.000đ", img: "https://images.unsplash.com/photo-1571115177098-24ec42ed204d?w=500" },
            { name: "Croissant Bơ Pháp", price: "45.000đ", img: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=500" },
            { name: "Macaron Ngọt Ngào", price: "120.000đ", img: "https://images.unsplash.com/photo-1569864358642-9d1684040f43?w=500" },
            { name: "Donut Socola", price: "25.000đ", img: "https://images.unsplash.com/photo-1551024601-bec78aea704b?w=500" },
            { name: "Bánh Mì Baguette", price: "30.000đ", img: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=500" }
        ];

        // --- 2. LOGIC LẤY TỪ KHÓA TỪ URL VÀ HIỂN THỊ ---
        document.addEventListener('DOMContentLoaded', () => {
            // Lấy tham số 'q' từ URL (ví dụ: ?q=banh)
            const params = new URLSearchParams(window.location.search);
            const keyword = params.get('q');

            const bannerTitle = document.getElementById('resultBannerTitle');
            const resultGrid = document.getElementById('searchResultsGrid');
            const searchCount = document.getElementById('searchCount');

            if (!keyword) {
                bannerTitle.innerText = "Chưa nhập từ khóa";
                searchCount.innerText = "Vui lòng nhập tên bánh để tìm kiếm.";
                return;
            }

            // Hiển thị từ khóa lên Banner
            // decodeURIComponent để hiển thị đúng Tiếng Việt (ví dụ %20 thành dấu cách)
            const decodedKeyword = decodeURIComponent(keyword);
            bannerTitle.innerText = `Tìm kiếm: "${decodedKeyword}"`;

            // Lọc sản phẩm
            const results = cakes.filter(cake => 
                cake.name.toLowerCase().includes(decodedKeyword.toLowerCase())
            );

            // Render kết quả
            if (results.length > 0) {
                searchCount.innerText = `Tìm thấy ${results.length} sản phẩm phù hợp`;
                
                results.forEach(cake => {
                    const card = `
                        <div class="product-card">
                            <img src="${cake.img}" alt="${cake.name}">
                            <div class="info">
                                <a href="#" class="name">${cake.name}</a>
                                <span class="price">${cake.price}</span>
                            </div>
                        </div>
                    `;
                    resultGrid.innerHTML += card;
                });
            } else {
                searchCount.innerText = "Rất tiếc, không tìm thấy sản phẩm nào phù hợp.";
                resultGrid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; margin-top: 20px;">
                        <i class="fa-regular fa-face-frown" style="font-size: 50px; color: #ccc; margin-bottom: 20px;"></i>
                        <p>Hãy thử tìm kiếm với từ khóa khác nhé!</p>
                    </div>
                `;
            }
        });

        // --- 3. XỬ LÝ TÌM KIẾM TIẾP TRÊN TRANG NÀY ---
        const searchInput = document.getElementById('searchInput');
        const btnSearch = document.getElementById('btnSearchAction');

        function handleSearchRedirect() {
            const newKeyword = searchInput.value.trim();
            if (newKeyword) {
                // Load lại trang chính nó với từ khóa mới
                window.location.href = `search-results.html?q=${encodeURIComponent(newKeyword)}`;
            }
        }

        btnSearch.addEventListener('click', handleSearchRedirect);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearchRedirect();
        });

        // Toggle Mobile Menu (Giữ logic cũ)
        const menuToggle = document.getElementById('mobile-menu-btn');
        const navbar = document.getElementById('navbar');
        menuToggle.addEventListener('click', () => {
            navbar.classList.toggle('active');
            const icon = menuToggle.querySelector('i');
            if (navbar.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-xmark');
            } else {
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            }
        });
    </script>
</body>
</html>

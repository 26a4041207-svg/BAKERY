<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Liên hệ | HONEYQUE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="lienhe.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<section class="contact-section fade-in">
    <div class="contact-wrapper">

        <!-- LEFT -->
        <div class="contact-left">
            <h1>Liên hệ với HONEYQUE</h1>
            <p class="desc">
                Nếu bạn cần tư vấn sản phẩm, đặt bánh theo yêu cầu
                hoặc có bất kỳ thắc mắc nào, đừng ngần ngại liên hệ với chúng tôi.
            </p>

            <div class="store-info">
                <p><strong>🏠 Cửa hàng:</strong> HONEYQUE</p>
                <p><strong>📍 Địa chỉ:</strong> Số 1 Tô Vĩnh Diện, Khương Đình, Hà Nội</p>
                <p><strong>📞 Hotline:</strong> 0837180651</p>
                <p><strong>✉ Email:</strong> honeyque@gmail.com</p>
            </div>

            <form id="contactForm" novalidate>
                <div class="form-group">
                    <input type="text" id="name" placeholder="Họ và tên">
                    <small class="error"></small>
                </div>

                <div class="form-group">
                    <input type="email" id="email" placeholder="Email (@gmail.com)">
                    <small class="error"></small>
                </div>

                <div class="form-group">
                    <input type="tel" id="phone" placeholder="Số điện thoại">
                    <small class="error"></small>
                </div>

                <div class="form-group">
                    <textarea id="message" placeholder="Nội dung liên hệ"></textarea>
                    <small class="error"></small>
                </div>

                <button type="submit">GỬI THÔNG TIN</button>
            </form>
        </div>

        <!-- RIGHT -->
        <div class="contact-right">
            <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3723.878995658295!2d105.82098141540233!3d21.00019048596421!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ac85c3cc7e7b%3A0x1b18b56df6b3395a!2zMSBQLiBUw7QgVsSpbmggRGnhu4duLCBLaMawxqFuZyBUcnVuZywgVGhhbmggWHXDom4sIEjDoCBO4buZaSwgSG_DoG5nIE5hbQ!5e0!3m2!1svi!2s!4v1700000000000"
  width="100%"
  height="100%"
  style="border:0;"
  allowfullscreen=""
  loading="lazy"
  referrerpolicy="no-referrer-when-downgrade">
</iframe>

        </div>

    </div>
</section>

<script src="lienhe.js"></script>
</body>
</html>

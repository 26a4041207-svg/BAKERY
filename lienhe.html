<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Liên hệ | HONEYQUE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="lienhe.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<section class="contact-wrapper fade-in">

    <div class="contact-left">

        <div class="info-box">
            <h3>Cửa hàng HONEYQUE</h3>

            <div class="info-item">📍 Số 1 Tô Vĩnh Diện, Khương Đình, Hà Nội</div>
            <div class="info-item">⏰ 8h – 22h (Thứ 2 – CN)</div>
            <div class="info-item">📞 0837180651</div>
            <div class="info-item">✉️ honeyque@gmail.com</div>
        </div>

        <div class="form-box">
            <h3>Liên hệ với chúng tôi</h3>
            <p>Nếu bạn có bất kỳ thắc mắc nào về sản phẩm hoặc dịch vụ, hãy để lại thông tin, HONEYQUE sẽ liên hệ sớm nhất.</p>
<br>
            <form id="contactForm">

                <input type="text" id="name" placeholder="Họ và tên">
                <small class="error"></small>

                <input type="email" id="email" placeholder="Email ">
                <small class="error"></small>

                <input type="text" id="phone" placeholder="Số điện thoại">
                <small class="error"></small>

                <textarea id="message" rows="4" placeholder="Nội dung"></textarea>
                <small class="error"></small>

                <button type="submit">Gửi thông tin</button>
            </form>
        </div>
    </div>

    <div class="contact-right">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3723.878995658295!2d105.82098141540233!3d21.00019048596421!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ac85c3cc7e7b%3A0x1b18b56df6b3395a!2zMSBQLiBUw7QgVsSpbmggRGnhu4duLCBLaMawxqFuZyBUcnVuZywgVGhhbmggWHXDom4sIEjDoCBO4buZaSwgSG_DoG5nIE5hbQ!5e0!3m2!1svi!2s!4v1700000000000" 
        allowfullscreen="" 
        loading="lazy"> 
    </iframe>
    </div>
</section>

<script src="lienhe.js"></script>
</body>
</html>

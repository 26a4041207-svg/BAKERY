
   <!-- Overlay -->
<div id="cart-overlay"></div>

<!-- Cart Drawer -->
<div id="cart-drawer">
  <div class="cart-header">
    <h3>GIỎ HÀNG CỦA BẠN</h3>
    <button id="cart-close">&times;</button>
  </div>

  <div class="cart-body" id="cart-items">
    <!-- JS render sản phẩm -->
  </div>
  <div class="cart-extra">

    <fieldset class="cart-fieldset">
  <legend>Thông tin liên hệ</legend>

  <div class="field-row">
    <label>Họ và tên</label>
    <input type="text" id="customer-name">
  </div>

  <div class="field-row">
    <label>Số điện thoại</label>
    <input type="text" id="customer-phone">
  </div>

  <div class="field-row">
    <label>Email</label>
    <input type="text" id="customer-email">
  </div>

  <div class="field-row">
    <label>Địa chỉ</label>
    <textarea id="customer-address"></textarea>
  </div>
</fieldset>


    <fieldset class="cart-fieldset">
      <legend>Phương thức nhận hàng</legend>

      <label class="radio-row">
        <input type="radio" name="delivery" value="shop" checked>
        Nhận hàng tại shop
      </label>

      <label class="radio-row">
        <input type="radio" name="delivery" value="ship">
        Nhận hàng qua vận chuyển
      </label>
    </fieldset>

  </div>

  <div class="cart-footer">
    <div class="cart-total">
      <span>Tổng cộng:</span>
      <strong id="cart-total-price">0₫</strong>
    </div>
    <button class="cart-checkout">Thanh toán</button>
  </div>
</div>
<!-- PAYMENT SUCCESS POPUP -->
<div id="payment-overlay"></div>

<div id="payment-popup">
  <h3>🎉 Đặt hàng thành công</h3>
  <p>
    Cảm ơn quý khách đã tin tưởng.<br>
    HONEYQUE xin phép gửi email đến quý khách sau khi đã xác nhận đơn hàng.
  </p>
  <button id="payment-close-btn">Đóng</button>
</div>

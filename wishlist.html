<!-- Wishlist drawer / overlay (inserted by wishlist.js) -->
<!-- Overlay -->
<div id="wishlist-overlay"></div>

<!-- Wishlist Drawer -->
<div id="wishlist-drawer">
  <div class="wishlist-header">
    <h3>YÊU THÍCH</h3>
    <button id="wishlist-close">&times;</button>
  </div>

  <div class="wishlist-body" id="wishlist-items">
    <!-- JS render sản phẩm yêu thích -->
    <div class="empty-msg">Bạn chưa có sản phẩm yêu thích nào.</div>
  </div>

  <div class="wishlist-footer">
    <button id="wishlist-clear" class="wishlist-btn">Xóa tất cả</button>
    <button id="wishlist-add-all-cart" class="wishlist-btn primary">Thêm tất cả vào giỏ</button>
  </div>
</div>
